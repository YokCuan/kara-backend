$kind: http-request
name: Create Sales Note Item
order: 1000
method: POST
url: '{{baseUrl}}/sales_note_items'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "salesNoteId": "{{salesNoteId}}",
      "name": "Product Name",
      "quantity": 2,
      "unitPrice": 50000
    }
