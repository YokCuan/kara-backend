$kind: http-request
url: "{{baseUrl}}/cashflow_expenses/:shopId/:id"
method: PATCH
headers:
  Content-Type: application/json
pathVariables:
  shopId: "{{shopId}}"
  id: "{{expenseId}}"
body:
  type: json
  content: |-
    {
      "expenseCategoryId": "{{expenseCategoryId}}",
      "supplierName": "Supplier Co.",
      "supplierPhone": "08012345678",
      "paidAmount": 50000,
      "purchasedAt": "2024-01-01T00:00:00Z",
      "createdBy": "{{userId}}",
      "updatedBy": "{{userId}}",
      "items": [
        {
          "name": "Gun Powder"
        },
        {
          "name": "Casket"
        },
        {
          "name": "Crates"
        }
      ]
    }
examples: ./.resources/Update Cashflow Expense.resources/examples
order: 2000
