$kind: http-request
name: Create Expense
url: "{{baseUrl}}/expenses"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "shopId": "{{shopId}}",
      "expenseCategoryId": "{{expenseCategoryId}}",
      "supplierName": "Supplier Ltd.",
      "supplierPhone": "08012345678",
      "paidAmount": 50000,
      "createdBy": "{{userId}}",
      "updatedBy": "{{userId}}"
    }
order: 1000
